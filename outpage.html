<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Snippet - DevSnippet | Powered by Sarlex Digital</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- html2pdf Library for PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-dark: #050811;
            --card-bg: rgba(13, 22, 40, 0.75);
            --input-bg: #09101f;
            --accent-cyan: #00f2fe;
            --accent-gold-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 242, 254, 0.25);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .gold-icon {
            background: var(--accent-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6));
        }

        .snippet-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: #7dd3fc !important;
            border-radius: 12px;
            padding: 16px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4) !important;
        }

        .form-label {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-copy {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.4);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
            color: #ffffff;
        }

        .btn-back {
            background: var(--accent-gold-gradient);
            color: #000000;
            font-weight: 800;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
            text-decoration: none;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
            color: #000000;
        }

        .btn-export {
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-export:hover {
            background: var(--accent-cyan);
            color: #000000;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .brand-text {
            font-weight: 700;
            color: var(--accent-cyan);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .brand-text:hover {
            color: #ffffff;
            text-shadow: 0 0 15px var(--accent-cyan);
        }

        .powered-by {
            font-size: 1.15rem;
            font-weight: 500;
            color: #ffffff;
        }

        .footer-copyright {
            color: var(--text-secondary) !important;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Futuristic Animated Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="container d-flex flex-column justify-content-between align-items-center min-vh-100 py-4" style="position: relative; z-index: 1;">
        
        <!-- Header / Navigation Section -->
        <div class="w-100 d-flex justify-content-between align-items-center mb-3" style="max-width: 750px;">
            <a href="index.html" class="btn btn-back rounded-pill px-4 py-2">
                ⬅ Back to Home
            </a>
            <h2 class="m-0 fw-bold text-light fs-3">
                <span class="gold-icon">⚡</span> DevSnippet
            </h2>
        </div>

        <!-- Content Display Card -->
        <div class="w-100 my-auto" style="max-width: 750px;">
            <div class="text-center mb-3">
                <h3 id="titleBox" class="text-light fw-bold">Loading Title...</h3>
            </div>

            <div class="card snippet-card p-4 p-md-5 mx-auto">
                <div class="mb-4">
                    <label class="form-label">Snippet Content</label>
                    <textarea id="contentBox" class="form-control font-monospace" rows="10" readonly></textarea>
                </div>

                <!-- Primary Action Buttons -->
                <div class="d-flex flex-column flex-sm-row justify-content-between gap-3 mb-4">
                    <button id="copyButton" class="btn btn-copy btn-lg px-4 py-2 rounded-3 w-100">📋 Copy to Clipboard</button>
                    <button class="btn btn-export btn-lg px-4 py-2 rounded-3 w-100" onclick="window.history.back()">⬅ Back</button>
                </div>

                <!-- Export / Download Options -->
                <div class="border-top border-secondary pt-3 mt-1">
                    <label class="form-label mb-2 fs-6">Download Snippet File</label>
                    <div class="row g-2">
                        <div class="col-4">
                            <button class="btn btn-export w-100 py-2 rounded-3" onclick="downloadTxt()">📄 .TXT</button>
                        </div>
                        <div class="col-4">
                            <button class="btn btn-export w-100 py-2 rounded-3" onclick="downloadPdf()">📕 .PDF</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer with Powered By Tagline -->
        <div class="text-center mt-4 mb-2">
            <div class="powered-by mb-1">
                <span class="gold-icon">⚡</span> Powered by <a href="https://sarlexdigital.com" class="brand-text" target="_blank">Sarlex Digital</a>
            </div>
            <div class="footer-copyright">
                &copy; 2026 DevSnippet. Built securely with Flask & SQLite.
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Background Particle Canvas Script -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = Math.min(Math.floor(window.innerWidth / 15), 80);

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                size: Math.random() * 2 + 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 242, 254, 0.6)';
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 242, 254, ${0.25 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- File Download Functions ---
        function getSnippetData() {
            return {
                title: document.getElementById('titleBox').innerText || 'snippet',
                text: document.getElementById('contentBox').value || ''
            };
        }

        function downloadTxt() {
            const data = getSnippetData();
            const blob = new Blob([data.text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${data.title}.txt`;
            a.click();
        }

        function downloadPdf() {
            const data = getSnippetData();
            
            
            const tempDiv = document.createElement('div');
            tempDiv.style.padding = '30px';
            tempDiv.style.backgroundColor = '#ffffff';
            tempDiv.style.color = '#000000';
            tempDiv.style.fontFamily = 'Courier, monospace';
            tempDiv.style.fontSize = '14px';
            tempDiv.style.whiteSpace = 'pre-wrap';
            tempDiv.style.wordBreak = 'break-all';

            
            tempDiv.innerHTML = `
                <h2 style="color: #000; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">${data.title}</h2>
                <div>${data.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
            `;

            const opt = {
                margin:       0.5,
                filename:     `${data.title}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // PDF ஜெனரேட் செய்துவிட்டு தற்காலிக Div நீக்கப்படும்
            html2pdf().set(opt).from(tempDiv).save();
        }
    </script>

    <!-- PRESERVED ORIGINAL JAVASCRIPT LOGIC -->
    <script>
        var copyButton = document.querySelector('#copyButton');
        copyButton.addEventListener('click', function() {
            var textarea = document.querySelector('#contentBox');
            textarea.select();
            document.execCommand('copy');
        });
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('data');
        var xhr = new XMLHttpRequest();
        xhr.open('GET', `http://127.0.0.1:5000/get_snippet?slug=${slug}`, true);
        xhr.onreadystatechange = function() {
            if (this.readyState === 4 && this.status === 200) {

                let res = JSON.parse(this.responseText);
                console.log(res);
                document.querySelector('#contentBox').value = res.content;
                console.log(res.title);
                if (res.title !== null && res.title !== undefined) {
                    document.getElementById('titleBox').innerText = res.title;
                } else {
                    document.getElementById('titleBox').innerText = 'snippeted details';
                }
            }
        };
        xhr.send();
        console.log(slug);
    </script>
</body>
</html>
